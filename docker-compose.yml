services:

  postgres:
    image: postgres:16
    container_name: deepverify_postgres
    restart: always
    environment:
      POSTGRES_USER: deepverify
      POSTGRES_PASSWORD: deepverify123
      POSTGRES_DB: deepverify_db
    ports:
      - "5433:5432"

  redis:
    image: redis:7
    container_name: deepverify_redis
    restart: always
    ports:
      - "6380:6379"